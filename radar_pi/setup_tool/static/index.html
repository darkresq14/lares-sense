<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lares Setup Tool — live point cloud</title>
<style>
  /* Instrument-panel HUD: near-black field, mono telemetry, amber accent.
     No external fonts — the Pi may serve an offline LAN. */
  :root {
    --bg: #0b0e11;
    --ink: #c9d1d9;
    --dim: #5c6672;
    --accent: #ffb454;
    --ok: #7ee081;
    --err: #ff6b6b;
    --panel: rgba(13, 17, 21, 0.85);
    --line: #1d242b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.5 ui-monospace, "Cascadia Mono", "JetBrains Mono", Menlo,
          Consolas, monospace;
  }
  #view { position: fixed; inset: 0; display: block; cursor: grab; }
  #view:active { cursor: grabbing; }

  .hud {
    position: fixed;
    top: 16px;
    left: 16px;
    padding: 10px 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 2px solid var(--accent);
    user-select: none;
  }
  .hud .title {
    color: var(--accent);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-size: 11px;
  }
  .hud .subtitle { color: var(--dim); font-size: 11px; margin-top: 2px; }

  .stats {
    position: fixed;
    top: 16px;
    right: 16px;
    padding: 10px 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    text-align: right;
    font-variant-numeric: tabular-nums;
    user-select: none;
  }
  .stats .frame { color: var(--ink); }
  .stats .meta { color: var(--dim); font-size: 11px; margin-top: 2px; }

  #status {
    position: fixed;
    bottom: 16px;
    left: 16px;
    padding: 6px 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    user-select: none;
  }
  #status::before {
    content: "";
    display: inline-block;
    width: 8px;
    height: 8px;
    margin-right: 8px;
    border-radius: 50%;
    background: var(--dim);
  }
  #status.ok::before { background: var(--ok); }
  #status.err::before { background: var(--err); }
  #status.connecting::before {
    background: var(--accent);
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: 0.25; } }

  .hint {
    position: fixed;
    bottom: 16px;
    right: 16px;
    color: var(--dim);
    font-size: 11px;
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 6px 12px;
    user-select: none;
  }
  body.editor-open .stats { right: 412px; }
  body.editor-open .hint { right: 412px; }

  /* ---- tiered config editor (issue #10) ---- */
  #editor {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: 396px;
    display: flex;
    flex-direction: column;
    background: rgba(11, 14, 17, 0.96);
    border-left: 1px solid var(--line);
    z-index: 10;
  }
  #editor header {
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--line);
  }
  #editor .title {
    color: var(--accent);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-size: 11px;
  }
  #editor .subtitle { color: var(--dim); font-size: 11px; margin-top: 2px; }
  #editor .actions {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
  }
  #save {
    font: inherit;
    color: #0b0e11;
    background: var(--accent);
    border: 0;
    padding: 5px 18px;
    cursor: pointer;
  }
  #save:hover { filter: brightness(1.1); }
  #save:disabled { opacity: 0.4; cursor: default; }
  #apply {
    font: inherit;
    color: var(--accent);
    background: transparent;
    border: 1px solid var(--accent);
    padding: 4px 16px;
    cursor: pointer;
  }
  #apply:hover { filter: brightness(1.2); }
  #apply:disabled { opacity: 0.4; cursor: default; }
  #config-status { font-size: 11px; color: var(--dim); }
  #config-status.ok { color: var(--ok); }
  #config-status.err { color: var(--err); }
  #apply-status { font-size: 11px; color: var(--dim); }
  #apply-status.ok { color: var(--ok); }
  #apply-status.err { color: var(--err); }
  #apply-status.busy { color: var(--accent); }
  #editor-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 11;
    font: inherit;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 2px solid var(--accent);
    padding: 6px 12px;
    cursor: pointer;
  }
  body.editor-open #editor-toggle { right: 412px; }
  #editor .body { overflow-y: auto; flex: 1; padding-bottom: 32px; }
  .tier { padding: 12px 16px 4px; }
  .tier h2 {
    margin: 0 0 2px;
    font-size: 12px;
    color: var(--ink);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .tier .blurb { color: var(--dim); font-size: 11px; margin: 0 0 8px; }
  .param {
    border: 1px solid var(--line);
    background: rgba(13, 17, 21, 0.6);
    padding: 10px 12px;
    margin: 0 0 10px;
  }
  .param .name { color: var(--accent); font-size: 12px; }
  .param .cmd { color: var(--dim); font-size: 10px; }
  .param .info { color: var(--dim); font-size: 11px; margin: 4px 0 8px; }
  .param .instance-label {
    color: var(--ink);
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin: 6px 0 4px;
  }
  .fields { display: grid; grid-template-columns: auto 1fr; gap: 4px 8px; align-items: center; }
  .fields label { color: var(--dim); font-size: 11px; white-space: nowrap; }
  .fields input {
    font: inherit;
    color: var(--ink);
    background: #0b0e11;
    border: 1px solid var(--line);
    padding: 3px 6px;
    width: 100%;
    min-width: 0;
  }
  .fields input:focus { outline: none; border-color: var(--accent); }
  .fields input.invalid { border-color: var(--err); }
  .field-cell { position: relative; }
  .field-cell .unit {
    position: absolute;
    right: 6px; top: 50%; transform: translateY(-50%);
    color: var(--dim); font-size: 10px; pointer-events: none;
  }
  .field-err { color: var(--err); font-size: 10px; grid-column: 1 / -1; }
  .fields.wide { grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); }
  .fields.wide input { padding: 3px 4px; }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div class="hud">
  <div class="title">Lares Setup Tool</div>
  <div class="subtitle">skeleton · live point cloud</div>
</div>

<div class="stats">
  <div class="frame" id="stat-frame">—</div>
  <div class="meta" id="stat-meta">waiting for frames</div>
</div>

<div id="status" class="connecting">connecting…</div>
<div class="hint">drag · orbit &nbsp;&nbsp; wheel · zoom</div>

<button id="editor-toggle" type="button">config ⚙</button>
<aside id="editor">
  <header>
    <div class="title">Sensor configuration</div>
    <div class="subtitle">Working Config · tiers guide what to touch</div>
    <div class="actions">
      <button id="save" type="button" disabled>Save</button>
      <button id="apply" type="button" disabled
        title="Apply saves this config and restarts the sensor with it. The
config channel is blind (no ACKs) — success is frames resuming on the view."
      >Apply</button>
      <span id="config-status">loading…</span>
    </div>
    <div class="actions">
      <span id="apply-status">sensor untouched — Apply to reconfigure</span>
    </div>
  </header>
  <div class="body" id="editor-body"></div>
</aside>

<script src="vendor/three.min.js"></script>
<script src="app.js"></script>
</body>
</html>
